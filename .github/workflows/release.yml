name: Release

# Pushing a tag v* builds the .deb, creates the GitHub release if there isn't
# one, attaches the .deb to it and adds it to the signed apt repository on the
# gh-pages branch.
#
# Three jobs so that no code from the build ever shares a runner with the
# signing key or a write token:
#   build  - runs cargo and dependency build scripts; no secrets, read-only
#            token, no cache; hands over the .deb as an artifact and its hash
#   attach - holds the release write token; no checkout, no cargo
#   apt    - holds the signing key (environment `release`) and the write token
#            for gh-pages; no cargo; signs the artifact from `build`, not
#            whatever is on the release

on:
  push:
    tags: ["v*"]
  # To redo a release's packaging by hand, from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, such as v0.1.0
        required: true

permissions:
  contents: read

# One release at a time: both jobs write to shared places.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # inputs.tag is empty on a tag push; on a manual run ref_name is a branch.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      # Third-party actions are pinned by commit, not by movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }} # the release's own source, also when run by hand
          persist-credentials: false

      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cosmic-ext-nightlight") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the package version $version." >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgbm-dev \
            libdrm-dev libinput-dev libudev-dev libseat-dev libssl-dev \
            libfontconfig-dev libfreetype-dev libexpat1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No rust-cache here on purpose: a release is built clean.
      # Exact versions, bumped by hand in a reviewed change (Dependabot does
      # not track crates installed this way).
      - name: Install just and cargo-deb
        run: cargo install --locked just@1.59.0 cargo-deb@3.8.0

      - name: Build the .deb
        run: just deb

      - name: Hash the .deb
        id: hash
        run: |
          set -- target/debian/cosmic-ext-nightlight_*.deb
          [ $# -eq 1 ] || { echo "Expected exactly one .deb." >&2; exit 1; }
          echo "sha256=$(sha256sum "$1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 7

  attach:
    # Runs no cargo and no checkout: only the release's write token.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the .deb to the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: debs

      - name: Create the release if needed, attach the .deb
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          # A release made by hand first is kept as it is.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
              -R "$GITHUB_REPOSITORY"
          fi
          cd debs
          for deb in cosmic-ext-nightlight_*.deb; do
            echo "$SHA256  $deb" | sha256sum -c -
            sha256sum "$deb" > "$deb.sha256"
            gh release upload "$TAG" "$deb" "$deb.sha256" --clobber -R "$GITHUB_REPOSITORY"
          done

  apt:
    # Signs only: takes the finished .deb from the build job's artifact and
    # runs gpg and apt-ftparchive.
    needs: [build, attach]
    runs-on: ubuntu-latest
    # The signing key and its id live in this environment (required reviewer,
    # limited to v* tags and main), not in repository secrets.
    environment: release
    permissions:
      contents: write # to push the gh-pages branch
    steps:
      # The publishing script from the default branch, which may be newer
      # than the release being packaged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: debs

      - name: Check it is the file the build job hashed
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd debs
          for deb in cosmic-ext-nightlight_*.deb; do
            echo "$SHA256  $deb" | sha256sum -c -
          done

      - name: Add it to the repository and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          KEY_ID: ${{ vars.APT_SIGNING_KEY_ID }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          scripts/publish-apt.sh site "$KEY_ID" debs/cosmic-ext-nightlight_*.deb

      - name: Publish the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository unchanged."
            exit 0
          fi
          git commit -m "apt repository: cosmic-ext-nightlight ${TAG#v}"
          # The token is passed only here, not stored in the checkout.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push
