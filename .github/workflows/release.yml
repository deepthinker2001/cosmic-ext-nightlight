name: Release

# A push to main whose Cargo.toml version has no tag yet is a release: the
# workflow builds the .deb, creates the tag v<version> at that commit and the
# GitHub release, attaches the .deb and adds it to the signed apt repository
# on the gh-pages branch. Any other push to main releases nothing.
#
# Three jobs so that no code from the build ever shares a runner with the
# signing key or a write token:
#   build  - first decides whether this push is a release (read-only token, no
#            secrets); if so runs cargo and dependency build scripts, with no
#            cache, and hands over the .deb as an artifact and its hash. The
#            other jobs run only when it says release
#   attach - holds the release write token; no checkout, no cargo; creates the
#            tag and the release
#   apt    - holds the signing key (environment `release`) and the write token
#            for gh-pages; no cargo; signs the artifact from `build`, not
#            whatever is on the release

on:
  push:
    branches: [main]
  # To redo a release's packaging by hand, from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package again, such as v0.1.0
        required: true

permissions:
  contents: read

# One release at a time: the jobs write to shared places. A push that arrives
# meanwhile waits, then sees the tag the first run made.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      # Third-party actions are pinned by commit, not by movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pushed commit, or the tag when run by hand (fully qualified, so
          # a branch of the same name can't stand in for it).
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0 # all history and branches, to check the tag is on main
          fetch-tags: true
          persist-credentials: false

      - name: Decide whether this is a release
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cosmic-ext-nightlight") | .version')
          [ -n "$version" ] || { echo "No package version found." >&2; exit 1; }
          tag="v$version"
          if [ -n "$INPUT_TAG" ]; then
            # Packaging an existing tag again: it must be that version's tag.
            if [ "$INPUT_TAG" != "$tag" ]; then
              echo "Tag $INPUT_TAG does not match the package version $version." >&2
              exit 1
            fi
            # Every real tag was made at a commit on main.
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "Tag $INPUT_TAG is at $sha, which is not on main." >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::Tag $tag already exists: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: steps.plan.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgbm-dev \
            libdrm-dev libinput-dev libudev-dev libseat-dev libssl-dev \
            libfontconfig-dev libfreetype-dev libexpat1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.plan.outputs.release == 'true'
        with:
          toolchain: stable

      # No rust-cache here on purpose: a release is built clean.
      # Exact versions, bumped by hand in a reviewed change (Dependabot does
      # not track crates installed this way).
      - name: Install just and cargo-deb
        if: steps.plan.outputs.release == 'true'
        run: cargo install --locked just@1.59.0 cargo-deb@3.8.0

      - name: Build the .deb
        if: steps.plan.outputs.release == 'true'
        run: just deb

      - name: Hash the .deb
        if: steps.plan.outputs.release == 'true'
        id: hash
        run: |
          set -- target/debian/cosmic-ext-nightlight_*.deb
          [ $# -eq 1 ] || { echo "Expected exactly one .deb." >&2; exit 1; }
          echo "sha256=$(sha256sum "$1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.release == 'true'
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 7

  attach:
    # Runs no cargo and no checkout: only the release's write token.
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and release and attach the .deb
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: debs

      - name: Create the tag and release if needed, attach the .deb
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          # An existing release (a redo) is kept as it is. Otherwise --target
          # makes the tag at the commit that was built.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --generate-notes --title "$TAG" \
              -R "$GITHUB_REPOSITORY"
          fi
          # A tag made meanwhile (or an old one on a redo) is not trusted:
          # --target is ignored for an existing tag, so compare.
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          [ "$tag_sha" = "$SHA" ] || { echo "Tag $TAG is at $tag_sha, not the built $SHA." >&2; exit 1; }
          cd debs
          for deb in cosmic-ext-nightlight_*.deb; do
            echo "$SHA256  $deb" | sha256sum -c -
            sha256sum "$deb" > "$deb.sha256"
            gh release upload "$TAG" "$deb" "$deb.sha256" --clobber -R "$GITHUB_REPOSITORY"
          done

  apt:
    # Signs only: takes the finished .deb from the build job's artifact and
    # runs gpg and apt-ftparchive.
    needs: [build, attach]
    runs-on: ubuntu-latest
    # The signing key and its id live in this environment (required reviewer,
    # limited to v* tags and main), not in repository secrets.
    environment: release
    permissions:
      contents: write # to push the gh-pages branch
    steps:
      # The publishing script from the default branch, which may be newer
      # than the release being packaged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: debs

      - name: Check it is the file the build job hashed
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd debs
          for deb in cosmic-ext-nightlight_*.deb; do
            echo "$SHA256  $deb" | sha256sum -c -
          done

      - name: Add it to the repository and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          KEY_ID: ${{ vars.APT_SIGNING_KEY_ID }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          scripts/publish-apt.sh site "$KEY_ID" debs/cosmic-ext-nightlight_*.deb

      - name: Publish the repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository unchanged."
            exit 0
          fi
          git commit -m "apt repository: cosmic-ext-nightlight ${TAG#v}"
          # The token is passed only here, not stored in the checkout.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push
